<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4 — Letterforms</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

 <div class="canvas">

  <div class="letter geometric">
    <div class="stem"></div>
    <div class="bowl"></div>
    <div class="counter"></div>
    <div class="leg"></div>
  </div>

<!-- R 02: Bubble -->
<div class="letter bubble">
  <div class="bubble-grid">
    <!-- Row 1 -->
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <!-- Row 2 -->
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <!-- Row 3 -->
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <!-- Row 4 -->
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <!-- Row 5 -->
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <!-- Row 6 -->
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <!-- Row 7 -->
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

  <!-- R 03: Pixel -->
<div class="letter pixel">
  <div class="pixel-grid">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<!-- R 04: Striped -->
<div class="letter striped">
  <div class="striped-shape">
    <div class="stripe-fill"></div>
  </div>
</div>

<!-- R 05: Modular -->
<div class="letter modular">
  <div class="mod-stem"></div>
  <div class="mod-circle"></div>
  <div class="mod-counter"></div>
  <div class="mod-leg"></div>
</div>

<!-- R 06: Fragmented -->
<div class="letter fragmented">
  <div class="frag-stem"></div>
  <div class="frag-top"></div>
  <div class="frag-bowl"></div>
  <div class="frag-middle"></div>
  <div class="frag-leg"></div>
</div>

<!-- R 06: Fragmented -->
<div class="letter fragmented">
  <div class="frag-stem"></div>
  <div class="frag-top"></div>
  <div class="frag-bowl"></div>
  <div class="frag-middle"></div>
  <div class="frag-leg"></div>
</div>

</div>
</div>
</body>
</html>
